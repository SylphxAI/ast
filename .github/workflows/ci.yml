name: CI

on:
  # No merge_group — Merge Queue off by default (Fast Trunk).
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Build & Test
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4

      - name: Enforce managed runner profiles
        run: |
          set -euo pipefail
          workflow=".github/workflows/ci.yml"
          if ! grep -Eq '^[[:space:]]*runs-on:[[:space:]]*sylphx-linux-standard([[:space:]]*(#.*)?)?$' "$workflow"; then
            echo "::error::$workflow must use sylphx-linux-standard"
            exit 1
          fi
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            xargs -0 awk '
              /^[[:space:]]*runs-on:[[:space:]]*/ {
                runner = $0
                sub(/^[[:space:]]*runs-on:[[:space:]]*/, "", runner)
                if (runner !~ /^sylphx-[[:alnum:]-]+([[:space:]]*(#.*)?)$/ &&
                    runner !~ /^\[self-hosted,[[:space:]]*sylphx-[[:alnum:]-]+\]([[:space:]]*(#.*)?)$/) {
                  print FILENAME ":" FNR ": ::error::unmanaged runner declaration: " $0
                  invalid = 1
                }
              }
              END { exit invalid }
            '

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Residual validate (informational)
        continue-on-error: true
        run: bun run validate
